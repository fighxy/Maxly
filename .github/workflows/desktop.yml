name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "orbitle-desktop/**"
      - "orbitle-shared/**"
      - "orbitle-compose/**"
      - "scripts/fetch-core.ps1"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "orbitle-desktop/**"
      - "orbitle-shared/**"
      - "orbitle-compose/**"
      - "scripts/fetch-core.ps1"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: orbitle-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Десктоп собирает ядро из исходников ревизии orbitle-desktop/core.lock.
      - name: Fetch max-kmp-core
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      # ffmpeg для тестов встроенного проигрывателя видео: без него они пропускаются.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # build включает jvmTest: тесты общего кода из orbitle-shared на библиотеках десктопа.
      - name: Build and tests
        env:
          ORBITLE_BUILD_SHA: ${{ github.sha }}
        run: ./gradlew --console=plain build
      - name: Test report
        if: failure()
        run: |
          find build/test-results -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null | while read -r report; do
            echo "::group::$report"
            head -c 20000 "$report"
            echo "::endgroup::"
          done

  package:
    name: Installer (${{ matrix.format }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            format: deb
            task: packageDeb
          - os: windows-latest
            format: msi
            task: packageMsi
          - os: macos-latest
            format: dmg
            task: packageDmg
    defaults:
      run:
        working-directory: orbitle-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # jpackage берёт инструменты упаковки из этого JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # jpackage собирает .deb через fakeroot.
      - name: Packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fakeroot
      - name: Fetch max-kmp-core
        if: runner.os != 'Windows'
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      - name: Fetch max-kmp-core
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: ./scripts/fetch-core.ps1
      # Для .msi плагин Compose сам скачивает WiX; .dmg без подписи и нотаризации.
      - name: Build installer
        if: runner.os != 'Windows'
        env:
          ORBITLE_BUILD_SHA: ${{ github.sha }}
        run: ./gradlew --console=plain ${{ matrix.task }}
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ORBITLE_BUILD_SHA: ${{ github.sha }}
        run: .\gradlew.bat --console=plain ${{ matrix.task }}
      # Ошибки jpackage, WiX и hdiutil пишутся в файлы, в лог шага они не попадают.
      - name: Packaging logs
        if: failure()
        run: |
          find build/compose/logs -type f 2>/dev/null | while read -r log; do
            echo "::group::$log"
            tail -c 20000 "$log"
            echo "::endgroup::"
          done
      - name: Collect installer
        run: |
          set -euo pipefail
          mkdir -p ../build
          found=0
          for file in build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }}; do
            [ -f "$file" ] || continue
            cp "$file" ../build/
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::Нет .${{ matrix.format }} в build/compose/binaries/main/${{ matrix.format }}"
            ls -R build/compose/binaries || true
            exit 1
          fi
          ls -lh ../build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Orbitle-desktop-${{ matrix.format }}-${{ github.sha }}
          path: build/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Пререлиз с установщиками всех трёх ОС, как у Android и iOS. Хранятся последние 5 сборок.
  publish:
    name: Publish pre-release
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Orbitle-desktop-*-${{ github.sha }}
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          files=()
          for file in installers/*; do
            ext="${file##*.}"
            target="installers/Orbitle-${short}.${ext}"
            mv "$file" "$target"
            files+=("$target")
          done
          ls -lh installers
          gh release delete "desktop-${short}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "desktop-${short}" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Orbitle Desktop ${short}" \
            --notes "Сборка для ПК ${GITHUB_SHA}: Windows (.msi), macOS (.dmg, без подписи — открыть через «Открыть» в контекстном меню), Linux (.deb). Для голосовых, кружков и видео нужен ffmpeg в PATH."
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("desktop-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done
