name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maxly-desktop/**"
      - "maxly-shared/**"
      - "maxly-compose/**"
      - "test-fixtures/calls/**"
      - "test-fixtures/client-rules/**"
      - "scripts/fetch-core.ps1"
      - "scripts/publish-latest.sh"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "maxly-desktop/**"
      - "maxly-shared/**"
      - "maxly-compose/**"
      - "test-fixtures/calls/**"
      - "test-fixtures/client-rules/**"
      - "scripts/fetch-core.ps1"
      - "scripts/publish-latest.sh"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: maxly-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Десктоп собирает ядро из исходников ревизии maxly-desktop/core.lock.
      - name: Fetch maxly-core
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      # ffmpeg для тестов встроенного проигрывателя видео: без него они пропускаются.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # build включает jvmTest: тесты общего кода из maxly-shared на библиотеках десктопа.
      - name: Build and tests
        env:
          MAXLY_BUILD_SHA: ${{ github.sha }}
        run: ./gradlew --console=plain build
      - name: Test report
        if: failure()
        run: |
          find build/test-results -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null | while read -r report; do
            echo "::group::$report"
            head -c 20000 "$report"
            echo "::endgroup::"
          done

  package:
    name: Installer (${{ matrix.format }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            format: deb
            task: packageDeb
          - os: windows-latest
            format: msi
            task: packageMsi
          - os: macos-latest
            format: dmg
            task: packageDmg
    defaults:
      run:
        working-directory: maxly-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # jpackage берёт инструменты упаковки из этого JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # jpackage собирает .deb через fakeroot.
      - name: Packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fakeroot
      - name: Fetch maxly-core
        if: runner.os != 'Windows'
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      - name: Fetch maxly-core
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: ./scripts/fetch-core.ps1
      # Для .msi плагин Compose сам скачивает WiX; .dmg без подписи и нотаризации.
      - name: Build installer
        if: runner.os != 'Windows'
        env:
          MAXLY_BUILD_SHA: ${{ github.sha }}
        run: ./gradlew --console=plain ${{ matrix.task }}
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MAXLY_BUILD_SHA: ${{ github.sha }}
        run: .\gradlew.bat --console=plain ${{ matrix.task }}
      # Ошибки jpackage, WiX и hdiutil пишутся в файлы, в лог шага они не попадают.
      - name: Packaging logs
        if: failure()
        run: |
          find build/compose/logs -type f 2>/dev/null | while read -r log; do
            echo "::group::$log"
            tail -c 20000 "$log"
            echo "::endgroup::"
          done
      - name: Collect installer
        run: |
          set -euo pipefail
          mkdir -p ../build
          found=0
          for file in build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }}; do
            [ -f "$file" ] || continue
            cp "$file" ../build/
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::Нет .${{ matrix.format }} в build/compose/binaries/main/${{ matrix.format }}"
            ls -R build/compose/binaries || true
            exit 1
          fi
          ls -lh ../build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Maxly-desktop-${{ matrix.format }}-${{ github.sha }}
          path: build/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Один пререлиз desktop-latest с установщиками всех трёх ОС под постоянными именами
  # (Maxly.msi, Maxly.dmg, Maxly.deb): внутри последняя сборка main, у которой прошли
  # тесты и собрались все три установщика.
  publish:
    name: Publish desktop-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Выпуски не гоняются наперегонки: следующий ждёт, а скрипт пропускает устаревшую сборку.
    concurrency:
      group: publish-desktop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Maxly-desktop-*-${{ github.sha }}
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-latest
          WATCH: maxly-desktop/ maxly-shared/ maxly-compose/ scripts/fetch-core.ps1 scripts/publish-latest.sh .github/workflows/desktop.yml
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          mkdir -p release
          files=()
          for ext in msi dmg deb; do
            found=(installers/*."$ext")
            if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}" ]; then
              echo "::error::Нужен ровно один .$ext, есть: ${found[*]}"
              exit 1
            fi
            cp "${found[0]}" "release/Maxly.$ext"
            files+=("release/Maxly.$ext")
          done
          ls -lh release
          export TITLE="🕊 Maxly для Desktop — последняя сборка"
          export NOTES="Свежая сборка Maxly из \`main\` для Windows, macOS и Linux: \`Maxly.msi\`, \`Maxly.dmg\`, \`Maxly.deb\`. Maxly ставится отдельным приложением, войти нужно заново, старый Orbitle потом можно удалить."$'\n\n'"Коммит ${short} (${GITHUB_SHA}), собран $(date -u '+%Y-%m-%d %H:%M') UTC. macOS: сборка без подписи — открыть через «Открыть» в контекстном меню. Для голосовых, кружков и видео нужен ffmpeg в PATH."
          bash scripts/publish-latest.sh "${files[@]}"
