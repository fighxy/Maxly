name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maxly-desktop/**"
      - "maxly-shared/**"
      - "maxly-compose/**"
      - "test-fixtures/calls/**"
      - "test-fixtures/client-rules/**"
      - "test-fixtures/service-messages/**"
      - "scripts/fetch-core.ps1"
      - "scripts/publish-latest.sh"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "maxly-desktop/**"
      - "maxly-shared/**"
      - "maxly-compose/**"
      - "test-fixtures/calls/**"
      - "test-fixtures/client-rules/**"
      - "test-fixtures/service-messages/**"
      - "scripts/fetch-core.ps1"
      - "scripts/publish-latest.sh"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Свой ffmpeg под LGPL для установщиков: из исходников ffmpeg.lock, без GPL, libx264 и
  # libopenh264 (scripts/build-ffmpeg.sh). Windows собирается кросс-компиляцией на Linux.
  # Сборка в кэше, пока не меняются ffmpeg.lock и скрипт.
  ffmpeg:
    name: ffmpeg (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Старый glibc: ffmpeg из .deb запускается и на системах старше раннера упаковки.
          - os: ubuntu-22.04
            target: linux-x64
            tools: nasm pkg-config libva-dev
          - os: ubuntu-24.04
            target: windows-x64
            tools: nasm pkg-config mingw-w64
          - os: macos-latest
            target: macos-arm64
    defaults:
      run:
        working-directory: maxly-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Cached ffmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: maxly-desktop/build/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ matrix.os }}-${{ hashFiles('maxly-desktop/ffmpeg.lock', 'maxly-desktop/scripts/build-ffmpeg.sh') }}
      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ${{ matrix.tools }}
      - name: Build tools
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: brew install pkgconf || true
      - name: Build ffmpeg
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/build-ffmpeg.sh ${{ matrix.target }}
      - name: Build info
        run: |
          cat build/ffmpeg/${{ matrix.target }}/BUILDINFO.txt
          ls -l build/ffmpeg/${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}-${{ github.sha }}
          path: maxly-desktop/build/ffmpeg/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  test:
    name: Build and tests
    needs: ffmpeg
    runs-on: ubuntu-latest
    env:
      # Ключ gifka.me для BuildConfig; у форков пусто — сборка без ключа.
      GIFKA_API_KEY: ${{ secrets.GIFKA_API_KEY }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: maxly-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # Десктоп собирает ядро из исходников ревизии maxly-desktop/core.lock.
      - name: Fetch maxly-core
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      # Тесты проигрывателя, голосовых и кружков идут с тем же ffmpeg, что ляжет в .deb.
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-linux-x64-${{ github.sha }}
          path: maxly-desktop/build/ffmpeg/linux-x64
      - name: Bundled ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libva2 libva-drm2
          chmod +x build/ffmpeg/linux-x64/ffmpeg
          build/ffmpeg/linux-x64/ffmpeg -hide_banner -version | head -n 3
      # build включает jvmTest: тесты общего кода из maxly-shared на библиотеках десктопа.
      - name: Build and tests
        env:
          MAXLY_BUILD_SHA: ${{ github.sha }}
        run: ./gradlew --console=plain build
      - name: Test report
        if: failure()
        run: |
          find build/test-results -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null | while read -r report; do
            echo "::group::$report"
            head -c 20000 "$report"
            echo "::endgroup::"
          done

  package:
    name: Installer (${{ matrix.format }})
    needs: [test, ffmpeg]
    runs-on: ${{ matrix.os }}
    env:
      # Ключ gifka.me для BuildConfig; у форков пусто — сборка без ключа.
      GIFKA_API_KEY: ${{ secrets.GIFKA_API_KEY }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            format: deb
            task: packageDeb
            ffmpeg: linux-x64
          - os: windows-latest
            format: msi
            task: packageMsi
            ffmpeg: windows-x64
          - os: macos-latest
            format: dmg
            task: packageDmg
            ffmpeg: macos-arm64
    defaults:
      run:
        working-directory: maxly-desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # jpackage берёт инструменты упаковки из этого JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # jpackage собирает .deb через fakeroot. libva нужна ffmpeg из установщика: jpackage
      # находит пакеты его библиотек и пишет их в Depends.
      - name: Packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fakeroot libva2 libva-drm2
      # Свой ffmpeg в ресурсы приложения; без него задача упаковки падает (maxly.ffmpeg.require).
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.ffmpeg }}-${{ github.sha }}
          path: maxly-desktop/build/ffmpeg/${{ matrix.ffmpeg }}
      - name: Bundled ffmpeg
        run: |
          chmod +x build/ffmpeg/${{ matrix.ffmpeg }}/ffmpeg* || true
          cat build/ffmpeg/${{ matrix.ffmpeg }}/BUILDINFO.txt
      - name: Fetch maxly-core
        if: runner.os != 'Windows'
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      - name: Fetch maxly-core
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: ./scripts/fetch-core.ps1
      # Для .msi плагин Compose сам скачивает WiX; .dmg без подписи и нотаризации.
      - name: Build installer
        if: runner.os != 'Windows'
        env:
          MAXLY_BUILD_SHA: ${{ github.sha }}
        run: ./gradlew --console=plain -Pmaxly.ffmpeg.require=true ${{ matrix.task }}
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MAXLY_BUILD_SHA: ${{ github.sha }}
        run: .\gradlew.bat --console=plain "-Pmaxly.ffmpeg.require=true" ${{ matrix.task }}
      # Ошибки jpackage, WiX и hdiutil пишутся в файлы, в лог шага они не попадают.
      - name: Packaging logs
        if: failure()
        run: |
          find build/compose/logs -type f 2>/dev/null | while read -r log; do
            echo "::group::$log"
            tail -c 20000 "$log"
            echo "::endgroup::"
          done
      - name: Collect installer
        run: |
          set -euo pipefail
          mkdir -p ../build
          found=0
          for file in build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }}; do
            [ -f "$file" ] || continue
            cp "$file" ../build/
            found=1
          done
          if [ "$found" -ne 1 ]; then
            echo "::error::Нет .${{ matrix.format }} в build/compose/binaries/main/${{ matrix.format }}"
            ls -R build/compose/binaries || true
            exit 1
          fi
          ls -lh ../build
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Maxly-desktop-${{ matrix.format }}-${{ github.sha }}
          path: build/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Один пререлиз desktop-latest с установщиками всех трёх ОС под постоянными именами
  # (Maxly.msi, Maxly.dmg, Maxly.deb): внутри последняя сборка main, у которой прошли
  # тесты и собрались все три установщика.
  publish:
    name: Publish desktop-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Выпуски не гоняются наперегонки: следующий ждёт, а скрипт пропускает устаревшую сборку.
    concurrency:
      group: publish-desktop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Maxly-desktop-*-${{ github.sha }}
          path: installers
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-latest
          WATCH: maxly-desktop/ maxly-shared/ maxly-compose/ scripts/fetch-core.ps1 scripts/publish-latest.sh .github/workflows/desktop.yml
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          mkdir -p release
          files=()
          for ext in msi dmg deb; do
            found=(installers/*."$ext")
            if [ "${#found[@]}" -ne 1 ] || [ ! -f "${found[0]}" ]; then
              echo "::error::Нужен ровно один .$ext, есть: ${found[*]}"
              exit 1
            fi
            cp "${found[0]}" "release/Maxly.$ext"
            files+=("release/Maxly.$ext")
          done
          ls -lh release
          export TITLE="🕊 Maxly для Desktop — последняя сборка"
          export NOTES="Свежая сборка Maxly из \`main\` для Windows, macOS и Linux: \`Maxly.msi\`, \`Maxly.dmg\`, \`Maxly.deb\`. Maxly ставится отдельным приложением, войти нужно заново, старый Orbitle потом можно удалить."$'\n\n'"Коммит ${short} (${GITHUB_SHA}), собран $(date -u '+%Y-%m-%d %H:%M') UTC. macOS: сборка без подписи — открыть через «Открыть» в контекстном меню. ffmpeg (LGPL) входит в установщик; кружки сжимает системный кодировщик H.264 (Windows N/KN — с Media Feature Pack, Linux — с драйвером VA-API)."
          bash scripts/publish-latest.sh "${files[@]}"
