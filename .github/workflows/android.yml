name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "maxly-android/**"
      - "maxly-shared/**"
      - "maxly-compose/**"
      - "test-fixtures/calls/**"
      - "test-fixtures/client-rules/**"
      - "scripts/publish-latest.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "maxly-android/**"
      - "maxly-shared/**"
      - "maxly-compose/**"
      - "test-fixtures/calls/**"
      - "test-fixtures/client-rules/**"
      - "scripts/publish-latest.sh"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: maxly-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      # Приложению нужен SDK 37.1, ядру (AGP 8.7) — SDK 35.
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.1" "platforms;android-37.0" "platforms;android-35" "build-tools;37.0.0" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      # AAR ядра зависят только от ревизии в core.lock: кэш экономит сборку ядра.
      - name: Cache core AAR
        id: core-cache
        uses: actions/cache@v4
        with:
          path: maxly-android/vendor
          key: max-core-aar-${{ hashFiles('maxly-android/core.lock', 'maxly-android/scripts/fetch-core.sh') }}
      - name: Fetch maxly-core
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest
      - name: Test report
        if: failure()
        run: |
          find app/build/test-results ../maxly-shared/build/test-results -name '*.xml' -exec grep -l '<failure' {} + 2>/dev/null | while read -r report; do
            echo "::group::$report"
            head -c 20000 "$report"
            echo "::endgroup::"
          done
      # Ключ подписи: секрет ORBITLE_KEYSTORE_BASE64 (с паролями; секреты репозитория сохранили
      # имена до переименования), иначе общий ключ разработки из maxly-android/signing. Один ключ на все сборки — обновления ставятся поверх.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ORBITLE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ORBITLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORBITLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORBITLE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/maxly.keystore"
            {
              echo "MAXLY_KEYSTORE_FILE=$RUNNER_TEMP/maxly.keystore"
              echo "MAXLY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MAXLY_KEY_ALIAS=$KEY_ALIAS"
              echo "MAXLY_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Подпись ключом из секрета ORBITLE_KEYSTORE_BASE64"
          else
            echo "::notice::Нет секрета ORBITLE_KEYSTORE_BASE64: APK подписан ключом разработки из репозитория"
          fi
      - name: Build APK
        env:
          MAXLY_BUILD_SHA: ${{ github.sha }}
          MAXLY_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ./gradlew --console=plain assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk" | head -n 3
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump badging "$apk" | head -n 1
          # JNI_OnLoad WebRTC зовёт org.jni_zero.JniInit: без него релиз падает на первом звонке.
          unzip -p "$apk" 'classes*.dex' > "$RUNNER_TEMP/classes.dex"
          for class in Lorg/jni_zero/JniInit\; Lorg/webrtc/PeerConnectionFactory\;; do
            grep -aq "$class" "$RUNNER_TEMP/classes.dex" || { echo "::error::R8 выкинул $class из APK"; exit 1; }
          done
          mkdir -p ../build && cp "$apk" ../build/Maxly.apk
          ls -lh ../build/Maxly.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maxly-apk-${{ github.sha }}
          path: build/Maxly.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Один пререлиз android-latest с Maxly.apk: ссылка постоянная, её можно открыть в браузере
  # на телефоне и сразу поставить. Внутри последняя сборка main, у которой прошли тесты.
  # На переходный период тот же APK выкладывается и как Orbitle.apk: старые ссылки не ломаются.
  publish:
    name: Publish android-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Выпуски не гоняются наперегонки: следующий ждёт, а скрипт пропускает устаревшую сборку.
    concurrency:
      group: publish-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Maxly-apk-${{ github.sha }}
          path: build
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-latest
          WATCH: maxly-android/ maxly-shared/ maxly-compose/ scripts/publish-latest.sh .github/workflows/android.yml
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          # Копия под прежним именем — на переходный период, для старых ссылок.
          cp build/Maxly.apk build/Orbitle.apk
          export TITLE="🕊 Maxly для Android — последняя сборка"
          export NOTES="Свежая сборка Maxly из \`main\`: клиент MAX без телеметрии и слежки, с режимом призрака. Android 8.0+. Скачайте \`Maxly.apk\`. Maxly ставится отдельным приложением, поэтому войти нужно заново, а старый Orbitle потом можно удалить. Файлы \`Orbitle.*\` оставлены для старых ссылок."$'\n\n'"Коммит ${short} (${GITHUB_SHA}), собран $(date -u '+%Y-%m-%d %H:%M') UTC. Откройте Maxly.apk в браузере на телефоне и установите (нужно разрешить установку из этого источника)."
          ls -lh build/Maxly.apk build/Orbitle.apk
          bash scripts/publish-latest.sh build/Maxly.apk build/Orbitle.apk
