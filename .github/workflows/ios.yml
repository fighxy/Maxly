name: iOS

on:
  push:
    branches: [main]
    paths:
      - "orbitl-ios/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "orbitl-ios/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test libraries
        run: swift test --package-path orbitl-ios

  app:
    name: App and MaxIos
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Require core token
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: |
          if [ -z "$MAX_KMP_CORE_TOKEN" ]; then
            echo "Нет секрета MAX_KMP_CORE_TOKEN. Добавьте PAT с чтением fighxy/max-kmp-core: Settings, Secrets and variables, Actions."
            exit 1
          fi
      - name: Fetch MaxIos.xcframework
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      - name: Build Orbitl
        run: xcodebuild -project orbitl-ios/Orbitl.xcodeproj -scheme Orbitl -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
