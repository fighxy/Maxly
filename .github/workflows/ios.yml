name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "orbitle-ios/**"
      - "scripts/**"
      - "test-fixtures/calls/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "orbitle-ios/**"
      - "scripts/**"
      - "test-fixtures/calls/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Xcode 26 и SDK iOS 26: код под #available(iOS 26) (Liquid Glass) компилируется только с ним.
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version
      - name: Test libraries
        run: |
          swift test --package-path orbitle-ios \
            -Xlinker=-sectcreate \
            -Xlinker=__TEXT \
            -Xlinker=__info_plist \
            -Xlinker="$GITHUB_WORKSPACE/orbitle-ios/Tests/OrbitleDataTests/Info.plist"
      - name: Test IPA validation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Crash reports
        if: failure()
        run: |
          # Упавший тестовый процесс оставляет отчёт .ips: в нём стек потока, где случился сбой.
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 2>/dev/null | while read -r report; do
            echo "::group::$report"
            head -c 60000 "$report"
            echo "::endgroup::"
          done

  app:
    name: App and MaxIos
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      # success, когда .ipa собрана и проверена: её публикует задача publish.
      ipa: ${{ steps.ipa.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Приложение собирается Xcode 26 с SDK iOS 26, иначе стекло iOS 26 (#available(iOS 26))
      # в сборку не попадает. Минимальная версия iOS остаётся прежней.
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "SDK iOS $sdk, симулятор $(xcrun --sdk iphonesimulator --show-sdk-version)"
          if [ "${sdk%%.*}" -lt 26 ]; then echo "::error::Нужен SDK iOS 26, выбран $sdk"; exit 1; fi
      - name: Check core token
        id: token
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: |
          if [ -z "$MAX_KMP_CORE_TOKEN" ]; then
            echo "::warning::Нет секрета MAX_KMP_CORE_TOKEN (PAT с чтением fighxy/max-kmp-core). Сборка приложения пропущена."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch MaxIos.xcframework
        if: steps.token.outputs.present == 'true'
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
          # Kotlin/Native 2.1.10 в ядре не читает заголовки SDK 26 (cinterop), поэтому
          # MaxIos.xcframework собирается Xcode 16.2, как раньше. Статическую библиотеку
          # потом компонует Xcode 26.
          DEVELOPER_DIR: /Applications/Xcode_16.2.app
        run: bash scripts/fetch-core.sh
      # Подпись ad-hoc нужна симулятору для Keychain: без неё ядро не создаётся, и запуск
      # не доходит до подключения к серверу.
      - name: Build Orbitle
        if: steps.token.outputs.present == 'true'
        run: xcodebuild -project orbitle-ios/Orbitle.xcodeproj -scheme Orbitle -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim ARCHS=arm64 CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- build
      # Запуск в симуляторе ловит падения, которых не видно при сборке. Если приложение
      # закрылось, шаг печатает отчёт о сбое (стек) и журнал приложения.
      - name: Launch in Simulator
        if: steps.token.outputs.present == 'true'
        # Обычно шаг идёт 3 минуты. Если симулятор завис при загрузке, шаг падает по
        # таймауту, а сборка и публикация .ipa ниже всё равно выполняются.
        timeout-minutes: 10
        env:
          ORBITLE_SIM_RUNTIME: "26.2"
        run: bash scripts/smoke-launch.sh build/sim/Build/Products/Debug-iphonesimulator/Orbitle.app
      # Неподписанный .ipa для iPhone: подписать его можно своим сертификатом
      # (Sideloadly, AltStore, eSign и т. п.) и поставить на устройство.
      - name: Build unsigned IPA
        id: ipa
        # Файл нужен и тогда, когда проверка запуска красная: по нему проверяют на телефоне.
        if: ${{ !cancelled() && steps.token.outputs.present == 'true' }}
        run: |
          set -euo pipefail
          xcodebuild -project orbitle-ios/Orbitle.xcodeproj -scheme Orbitle -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          app="build/device/Build/Products/Release-iphoneos/Orbitle.app"
          test -d "$app"
          # Стекло iOS 26 действительно в сборке: бинарник ссылается на API SwiftUI iOS 26.
          glass="$(nm -u "$app/Orbitle" | grep -c -E 'glassEffect|GlassProminent' || true)"
          echo "Символов стекла iOS 26 в Orbitle: $glass"
          if [ "$glass" -eq 0 ]; then echo "::error::В сборке нет кода iOS 26 (glassEffect)"; exit 1; fi
          rm -rf build/ipa build/Orbitle.ipa && mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../Orbitle.ipa Payload)
          python3 scripts/validate-ipa.py build/Orbitle.ipa --alternate-icon AppIconLight --alternate-icon AppIconBlue
          ls -lh build/Orbitle.ipa
      - name: Upload IPA
        if: ${{ !cancelled() && steps.ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Orbitle-unsigned-ipa-${{ github.sha }}
          path: build/Orbitle.ipa
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # Один пререлиз ios-latest с Orbitle.ipa: ссылка постоянная, внутри последняя сборка main, у
  # которой прошли тесты, запуск в симуляторе и проверка .ipa. Артефакт прогона скачивается
  # ZIP-архивом, и «Файлы» на iPhone его часто не открывают, а ссылка из выпуска в Safari
  # скачивает саму .ipa, её сразу можно открыть в eSign.
  publish:
    name: Publish ios-latest
    needs: [test, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.app.outputs.ipa == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Выпуски не гоняются наперегонки: следующий ждёт, а скрипт пропускает устаревшую сборку.
    concurrency:
      group: publish-ios
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Orbitle-unsigned-ipa-${{ github.sha }}
          path: build
      - name: Publish IPA
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ios-latest
          WATCH: orbitle-ios/ scripts/ .github/workflows/ios.yml
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::7}"
          export TITLE="Orbitle iOS ${short}"
          export NOTES="Неподписанная сборка ${GITHUB_SHA} от $(date -u '+%Y-%m-%d %H:%M') UTC. Скачайте Orbitle.ipa в Safari на iPhone и откройте в eSign."
          ls -lh build/Orbitle.ipa
          bash scripts/publish-latest.sh build/Orbitle.ipa
