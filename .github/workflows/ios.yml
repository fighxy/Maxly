name: iOS

on:
  push:
    branches: [main]
    paths:
      - "orbitl-ios/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "orbitl-ios/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  test:
    name: Swift tests
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Test libraries
        run: |
          swift test --package-path orbitl-ios \
            -Xlinker=-sectcreate \
            -Xlinker=__TEXT \
            -Xlinker=__info_plist \
            -Xlinker="$GITHUB_WORKSPACE/orbitl-ios/Tests/OrbitlDataTests/Info.plist"
      - name: Crash reports
        if: failure()
        run: |
          # Упавший тестовый процесс оставляет отчёт .ips: в нём стек потока, где случился сбой.
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 2>/dev/null | while read -r report; do
            echo "::group::$report"
            head -c 60000 "$report"
            echo "::endgroup::"
          done

  app:
    name: App and MaxIos
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app
      - name: Check core token
        id: token
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: |
          if [ -z "$MAX_KMP_CORE_TOKEN" ]; then
            echo "::warning::Нет секрета MAX_KMP_CORE_TOKEN (PAT с чтением fighxy/max-kmp-core). Сборка приложения пропущена."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch MaxIos.xcframework
        if: steps.token.outputs.present == 'true'
        env:
          MAX_KMP_CORE_TOKEN: ${{ secrets.MAX_KMP_CORE_TOKEN }}
        run: bash scripts/fetch-core.sh
      - name: Build Orbitl
        if: steps.token.outputs.present == 'true'
        run: xcodebuild -project orbitl-ios/Orbitl.xcodeproj -scheme Orbitl -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
